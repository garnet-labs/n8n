name: Deploy build (recorded)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'rb/**'

permissions: {}

concurrency:
  group: record-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  deploy-build:
    name: Install and deploy build (recorded)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: '--max-old-space-size=7168'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: npm install -g corepack@latest && corepack enable

      # OIDC exchange; no token to configure.
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2

      - name: Install dependencies (lifecycle scripts execute here)
        run: pnpm install --frozen-lockfile

      - name: Build the deployment
        run: pnpm build:n8n

      - name: Let sensor settle
        if: always()
        run: sleep 30
