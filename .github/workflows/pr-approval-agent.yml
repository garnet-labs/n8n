name: PR Approval Agent

on:
  workflow_run:
    workflows: [Garnet Runtime Visibility]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-approval-${{ inputs.pr_number || github.event.issue.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.ref == 'refs/heads/master' && (
        github.event_name != 'issue_comment' || (
          github.event.issue.pull_request &&
          github.event.comment.user.login == 'garnet-runtime-review[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      STAMPHOG_API_REVIEW: '1'
      STAMPHOG_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout trusted master
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve current PR and await finalized record
        id: pr
        run: python3 .github/merge-gate/pr_context.py resolve
      - name: Install uv
        if: steps.pr.outputs.ready == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Review API diff without checking out PR code
        if: steps.pr.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          uv run tools/pr-approval-agent/review_pr.py "$PR_NUMBER" \
            --repo "$STAMPHOG_REPOSITORY" --output-json "$RUNNER_TEMP/review.json"
      - name: Publish current-head verdict
        if: always() && steps.pr.outputs.ready == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          python3 .github/merge-gate/pr_context.py publish \
            "$PR_NUMBER" "$EXPECTED_HEAD" "$RUNNER_TEMP/review.json"
      - name: Upload verdict
        if: always() && steps.pr.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: review-${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/review.json
          if-no-files-found: ignore
